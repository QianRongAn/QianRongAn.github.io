name: Verify live Projects display
on:
  push:
    branches: ["codex/project-figures-local-af5f1ce"]
    paths: [".github/workflows/import-project-figures.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify published main-site Projects iframe
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import time, subprocess
          base = "https://qianrongan.github.io"
          version = "20261103-localfigures-v3"
          for attempt in range(36):
              try:
                  with urlopen(base + "/projects/index.html?v=" + version + "-" + str(attempt), timeout=15) as response:
                      body = response.read().decode()
                  with urlopen(base + "/?enter=about&v=" + version + "-" + str(attempt), timeout=15) as response:
                      root = response.read().decode()
                  if 'assets/figures/prostate-aurka.webp' in body and version in root:
                      break
              except Exception as error:
                  print("Waiting for publication", type(error).__name__, flush=True)
              time.sleep(5)
          else:
              raise RuntimeError("Production did not receive local figures and iframe update")
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for label, viewport in [("desktop", {"width":1440,"height":1000}), ("mobile", {"width":390,"height":844})]:
                  context = browser.new_context(viewport=viewport, reduced_motion="reduce", is_mobile=(label=="mobile"), has_touch=(label=="mobile"))
                  tab = context.new_page()
                  tab.goto(base + "/?enter=about&v=" + version, wait_until="domcontentloaded")
                  tab.wait_for_function("typeof window.switchPage === 'function'", timeout=30000)
                  tab.evaluate("window.switchPage(3)")
                  frame = tab.frame_locator("#projectsFrame")
                  frame.locator("#multicancer-fragmentomics .project-trigger").wait_for(state="visible",timeout=30000)
                  frame.locator("#multicancer-fragmentomics .project-reveal[inert]").wait_for(state="attached",timeout=30000)
                  assert frame.locator("article.project").count()==8
                  for key in ["multicancer-fragmentomics","prostate-aurka","colorectal-invasion","prostate-genomics","kidney-immunotherapy"]:
                      card = frame.locator("#"+key)
                      card.locator(".project-trigger").focus()
                      card.locator(".project-trigger").press("Enter")
                      image = card.locator(".paper-figure")
                      image.wait_for(state="visible")
                      assert image.evaluate("async (im) => { await im.decode(); return im.naturalWidth > 200; }"), key
                      assert image.evaluate("(im) => new URL(im.currentSrc).origin === location.origin"), key
                      card.locator(".image-button").focus()
                      card.locator(".image-button").press("Enter")
                      assert frame.locator(".lightbox").evaluate("(d) => d.open")
                      frame.locator(".lightbox-close").click()
                      card.locator(".project-trigger").focus()
                      card.locator(".project-trigger").press("Enter")
                  print("PASS LIVE MAIN-SITE IFRAME:", label, "8 projects, 5 local original figures, expand and enlarge", flush=True)
                  context.close()
              browser.close()
          
          PY
