<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>榕树 · 已有试片</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1eee6;color:#343a30;font:15px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:28px 24px}header{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:16px}h1{font:400 clamp(22px,3vw,32px)/1.2 Georgia,serif;margin:0}a{color:inherit;text-underline-offset:4px}video{display:block;width:100%;max-height:calc(100vh - 180px);aspect-ratio:16/9;background:#172516;object-fit:contain}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}button{background:transparent;color:inherit;border:1px solid #929b86;padding:9px 18px;font:inherit;cursor:pointer}button:hover{background:#e3e8da}output{margin-left:auto;font-variant-numeric:tabular-nums}p{color:#66705d;margin:14px 0}button:focus-visible,a:focus-visible{outline:2px solid #647950;outline-offset:4px}@media(max-width:600px){main{padding:18px 12px}header{display:block}header a{display:inline-block;margin-top:14px}output{width:100%;margin:0}}</style>
</head><body><main>
<header><h1>榕树 · 已有试片</h1><a href="../index.html?enter=about">返回网站 ↗</a></header>
<video id="film" controls playsinline preload="auto" poster="../assets/worlds/banyan-daylight.webp" src="../assets/worlds/banyan-flight148.mp4"></video>
<nav aria-label="视频播放"><button id="play">从头播放</button><button id="end" disabled title="原文件不完整，暂不可定位末帧">结尾帧待恢复</button><button id="full">全屏观看</button><output id="time" aria-live="off">0.00 / 8.04 秒</output></nav>
<p role="status">文件恢复中：当前下载件被截断，实际只能播放约1.3秒。播放器标注的8秒来自文件头，不代表文件完整；正在取回同一条试片的完整原文件。</p>
</main><script>
const film=document.getElementById('film'),time=document.getElementById('time');
function showTime(){time.textContent=film.currentTime.toFixed(2)+' / '+(Number.isFinite(film.duration)?film.duration.toFixed(2):'8.04')+' 秒';}
film.addEventListener('timeupdate',showTime);film.addEventListener('loadedmetadata',showTime);
document.getElementById('play').onclick=()=>{film.currentTime=0;film.play().catch(()=>{});};
document.getElementById('end').onclick=()=>{film.pause();if(Number.isFinite(film.duration))film.currentTime=Math.max(0,film.duration-1/48);};
document.getElementById('full').onclick=()=>{if(film.requestFullscreen)film.requestFullscreen();else if(film.webkitEnterFullscreen)film.webkitEnterFullscreen();};
</script></body></html>
